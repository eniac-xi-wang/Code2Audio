[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code2audio-pipeline"
version = "0.1.0"
description = "Agent-authored waveform programs with independent caption and semantic verification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "certifi>=2024.2"]

[project.optional-dependencies]
verify = ["onnxruntime>=1.19,<2", "transformers>=4.40,<5", "huggingface-hub>=0.25,<1"]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
c2a = "code2audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code2audio = ["prompts/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

